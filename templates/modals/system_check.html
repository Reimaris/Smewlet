<div id="system-check-modal" class="nzb-modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
    <div class="nzb-modal-dialog nzb-modal-dialog-lg bg-[#1e1e24] border border-[#3f3f46] rounded-xl shadow-2xl w-full overflow-hidden flex flex-col" @click.away="document.getElementById('system-check-modal').remove()">
        
        <div class="flex items-center justify-between p-4 border-b border-[#3f3f46] bg-[#2a2a32]">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 shrink-0 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0zM13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                System Diagnostics &amp; Health
            </h2>
            <button onclick="document.getElementById('system-check-modal').remove()" class="p-1.5 text-[#a1a1aa] hover:text-white hover:bg-[#3f3f46]/50 rounded-lg transition-colors focus:outline-none">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="p-6 overflow-y-auto min-h-0">
            <p class="text-sm text-[#a1a1aa] mb-4">
                Testing real-time connectivity and response latency across active services and core infrastructure...
            </p>
            
            <div id="system-check-results" hx-get="/system/check/run" hx-trigger="load" class="min-h-[200px] flex items-center justify-center">
                <div class="flex flex-col items-center justify-center text-[#a1a1aa]">
                    <svg class="w-8 h-8 shrink-0 animate-spin mb-4 text-[#d40060]" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Running connectivity tests...</span>
                </div>
            </div>
            
            <div class="mt-6 flex items-center justify-between border-t border-[#3f3f46]/50 pt-4">
                <button type="button"
                        hx-get="/system/check/run"
                        hx-target="#system-check-results"
                        class="group bg-[#2a2a32] hover:bg-[#3f3f46] text-white px-4 py-2 rounded-lg text-xs font-semibold border border-[#3f3f46] transition-colors flex items-center gap-2">
                    <svg class="w-3.5 h-3.5 shrink-0 text-[#d40060] group-[.htmx-request]:animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Re-run Diagnostics</span>
                </button>
                <button onclick="document.getElementById('system-check-modal').remove()" class="bg-[#3f3f46] hover:bg-[#52525b] text-white px-5 py-2 rounded-lg text-xs font-medium transition-colors">
                    Close
                </button>
            </div>
        </div>
        
    </div>
</div>
